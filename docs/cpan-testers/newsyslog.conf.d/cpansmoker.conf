# FreeBSD newsyslog(8) integration for cpansmoker.
# Do NOT install before daemon(8) has been launched with -H.
# Keep this to one entry; do not duplicate in /etc/newsyslog.conf.
# 7 archives, size threshold 10 MiB, hourly check by stock newsyslog cron.
/home/cpansmoke/logs/cpansmoker.log cpansmoke:cpansmoke 600 7 10M * PZ /home/cpansmoke/logs/cpansmoker.pid SIGHUP
