name: MetaProvides baseline

on:
  pull_request:
    paths:
      - '.github/workflows/metaprovides-baseline.yml'
  workflow_dispatch:

jobs:
  cpan-release-baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.42']
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Record environment
        run: |
          perl -V
          uname -a
      - name: Install cpanminus
        run: cpanm --notest App::cpanminus
      - name: Install known prerequisite with upstream test-suite incompatibility
        run: |
          # Hash::Merge::Simple 0.052 fails t/00-load.t on modern Perl because
          # its -T shebang is not propagated by the test harness. Its other
          # tests pass in this runner; install it without tests so we can
          # expose the MetaProvides test result itself.
          cpanm --notest Hash::Merge::Simple
      - name: Test exact CPAN release
        run: cpanm --verbose --test-only 'Dist::Zilla::Plugin::MetaProvides@2.002004'

      - name: Checkout historical upstream master
        uses: actions/checkout@v4
        with:
          repository: kentnl/Dist-Zilla-Plugin-MetaProvides
          ref: cc8c2433f6e178c29eec5a0ced60fc35686108c8
          path: upstream-master

      - name: Install historical master prerequisites
        working-directory: upstream-master
        run: cpanm --notest --installdeps .

      - name: Test historical master through generated Makefile.PL
        working-directory: upstream-master
        run: |
          perl Makefile.PL
          make test
