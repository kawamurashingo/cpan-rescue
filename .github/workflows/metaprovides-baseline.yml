name: MetaProvides baseline

on:
  pull_request:
    paths:
      - '.github/workflows/metaprovides-baseline.yml'
  workflow_dispatch:

jobs:
  cpan-release-baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.42']
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Record environment
        run: |
          perl -V
          uname -a
      - name: Install cpanminus
        run: cpanm --notest App::cpanminus
      - name: Install known prerequisite with upstream test-suite incompatibility
        run: |
          # Hash::Merge::Simple 0.052 fails t/00-load.t on modern Perl because
          # its -T shebang is not propagated by the test harness. Its other
          # tests pass in this runner; install it without tests so we can
          # expose the MetaProvides test result itself.
          cpanm --notest Hash::Merge::Simple
      - name: Test exact CPAN release
        run: cpanm --verbose --test-only 'Dist::Zilla::Plugin::MetaProvides@2.002004'

      - name: Checkout historical upstream master
        uses: actions/checkout@v4
        with:
          repository: kentnl/Dist-Zilla-Plugin-MetaProvides
          ref: cc8c2433f6e178c29eec5a0ced60fc35686108c8
          path: upstream-master

      - name: Install historical master prerequisites
        working-directory: upstream-master
        run: cpanm --notest --installdeps .

      - name: Test historical master through generated Makefile.PL
        working-directory: upstream-master
        run: |
          perl Makefile.PL
          make test


      - name: Test exact Package CPAN release
        run: cpanm --verbose --test-only 'Dist::Zilla::Plugin::MetaProvides::Package@2.004003'

      - name: Checkout Package historical master
        uses: actions/checkout@v4
        with:
          repository: kentnl/Dist-Zilla-Plugin-MetaProvides-Package
          ref: 8fa754725c001fd584c2269cd5c5c22a8064a5a0
          path: package-master

      - name: Install Package historical master prerequisites
        working-directory: package-master
        run: cpanm --notest --installdeps .

      - name: Test Package historical master through generated Makefile.PL
        working-directory: package-master
        run: |
          perl Makefile.PL
          make test


  downstream-baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.42']
        dist:
          - Dist::Zilla::PluginBundle::Author::GETTY
          - Dist::Zilla::PluginBundle::RSRCHBOY
          - Dist::Zilla::PluginBundle::Author::ETHER
          - Dist::Zilla::PluginBundle::DROLSKY
          - Dist::Zilla::PluginBundle::Starter
    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Record environment
        run: perl -V
      - name: Install known prerequisite with upstream test-suite incompatibility
        run: cpanm --notest Hash::Merge::Simple
      - name: Establish downstream baseline
        run: cpanm --verbose --test-only "${{ matrix.dist }}"


  downstream-candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.42']
        dist:
          - Dist::Zilla::PluginBundle::Author::ETHER
          - Dist::Zilla::PluginBundle::DROLSKY
          - Dist::Zilla::PluginBundle::Starter
    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install known prerequisite with upstream test-suite incompatibility
        run: cpanm --notest Hash::Merge::Simple
      - name: Install historical MetaProvides candidate
        run: |
          git clone https://github.com/kentnl/Dist-Zilla-Plugin-MetaProvides.git core-candidate
          git -C core-candidate checkout cc8c2433f6e178c29eec5a0ced60fc35686108c8
          (cd core-candidate && cpanm --notest --installdeps . && perl Makefile.PL && make install)
      - name: Install historical Package candidate
        run: |
          git clone https://github.com/kentnl/Dist-Zilla-Plugin-MetaProvides-Package.git package-candidate
          git -C package-candidate checkout 8fa754725c001fd584c2269cd5c5c22a8064a5a0
          (cd package-candidate && cpanm --notest --installdeps . && perl Makefile.PL && make install)
      - name: Test downstream against candidate
        run: cpanm --verbose --test-only "${{ matrix.dist }}"


  modern-maintenance-build:
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'
      - name: Checkout historical flattened source
        uses: actions/checkout@v4
        with:
          repository: kentnl/Dist-Zilla-Plugin-MetaProvides
          ref: cc8c2433f6e178c29eec5a0ced60fc35686108c8
          path: upstream-master
      - name: Install Dist::Zilla and declared distribution prerequisites
        working-directory: upstream-master
        run: |
          cpanm --notest Hash::Merge::Simple
          cpanm --notest Dist::Zilla
          cpanm --notest Dist::Zilla::Plugin::Bootstrap::lib
          cpanm --notest Dist::Zilla::Plugin::GithubMeta
          cpanm --notest 'Dist::Zilla::Plugin::MetaProvides::Package@2.004003'
          cpanm --notest Dist::Zilla::Plugin::MetaData::BuiltWith
          cpanm --notest Dist::Zilla::Plugin::Git::Contributors
          cpanm --notest --installdeps .
      - name: Attempt historical flattened dist.ini build
        working-directory: upstream-master
        run: dzil build
